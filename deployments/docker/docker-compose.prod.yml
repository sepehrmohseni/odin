# A production-style single-host deployment: Odin from the repository's Dockerfile with your own
# config, plus Redis for shared rate limits and caching. Run from this directory:
#
#   ODIN_JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --wait
#
# Put your configuration in ../../config/config.yaml (see config/default_config.yaml and
# docs/configuration.md). Use redis://redis:6379 as rateLimit.redisUrl / cache.redisUrl.

name: odin-prod

services:
  odin:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: odin:latest
    restart: always
    ports:
      - '8080:8080'
    environment:
      ODIN_JWT_SECRET: ${ODIN_JWT_SECRET:?set ODIN_JWT_SECRET}
      ODIN_ADMIN_PASSWORD: ${ODIN_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../../config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', '/app/odin', '-healthcheck']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8.12.0-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
