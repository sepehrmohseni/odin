{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odin.fullname" . }}-secrets
  labels:
    {{- include "odin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.secrets.jwtSecret }}
  jwt-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
