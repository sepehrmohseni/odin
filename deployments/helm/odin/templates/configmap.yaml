apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odin.fullname" . }}-config
  labels:
    {{- include "odin.labels" . | nindent 4 }}
data:
  # Odin's config schema (see docs/configuration.md). Secrets are not here: the JWT secret and
  # the admin password come from the chart's Secret through environment variables.
  config.yaml: |
    server:
      port: {{ .Values.config.gateway.port }}
      readTimeout: {{ .Values.config.gateway.readTimeout }}
      writeTimeout: {{ .Values.config.gateway.writeTimeout }}
      idleTimeout: {{ .Values.config.gateway.idleTimeout }}
      {{- with .Values.config.gateway.trustedProxies }}
      trustedProxies:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    logging:
      level: {{ .Values.config.logging.level }}
      json: {{ eq .Values.config.logging.format "json" }}

    monitoring:
      enabled: {{ .Values.monitoring.enabled }}
      path: /metrics

    admin:
      enabled: {{ .Values.config.admin.enabled }}
      username: {{ .Values.config.admin.username | quote }}

    auth:
      accessTokenTTL: {{ .Values.config.auth.accessTokenTTL }}
      refreshTokenTTL: {{ .Values.config.auth.refreshTokenTTL }}
      ignorePathRegexes:
        - ^/health$
        - ^/ready$
        - ^/live$
        - ^/metrics$

    {{- with .Values.config.rateLimit }}
    rateLimit:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    {{- with .Values.config.cache }}
    cache:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  services.yaml: |
    services:
      {{- toYaml .Values.services | nindent 6 }}
