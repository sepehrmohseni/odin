# Default values for odin
replicaCount: 2

image:
  repository: ghcr.io/sepehrmohseni/odin
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: odin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Rendered into Odin's config.yaml by templates/configmap.yaml.
config:
  gateway:
    port: 8080
    readTimeout: 30s
    writeTimeout: 30s
    idleTimeout: 120s
    # CIDRs of load balancers / ingress controllers whose X-Forwarded-For is trusted.
    trustedProxies: []

  # The admin interface is off by default. When enabling it, set secrets.adminPassword (or
  # provide admin-password in secrets.existingSecret); otherwise a random password is logged.
  admin:
    enabled: false
    username: admin

  auth:
    accessTokenTTL: 1h
    refreshTokenTTL: 24h

  logging:
    level: info
    format: json

  # Optional rateLimit and cache sections, copied into config.yaml as they are, e.g.
  # rateLimit: {enabled: true, limit: 600, duration: 1m, strategy: redis, redisUrl: redis://redis:6379}
  rateLimit: {}
  cache: {}

# Services in Odin's format (docs/configuration.md), rendered into services.yaml.
services: []

monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

secrets:
  # JWT signing secret for services with authentication: true.
  jwtSecret: ''
  # Admin password (when config.admin.enabled).
  adminPassword: ''
  # Use an existing Secret with keys jwt-secret and admin-password instead of the two above.
  existingSecret: ''
