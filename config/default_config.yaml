# Odin's built-in configuration (the Docker image's /app/config/config.yaml).
#
# It starts a gateway with no routes: /health, /ready, /live and /metrics answer, nothing else
# does. Mount your own file over /app/config/config.yaml to add services. See
# docs/getting-started.md and docs/configuration.md.
#
# ${NAME:-default} values are read from the environment.

server:
  port: ${GATEWAY_PORT:-8080}
  readTimeout: 30s
  writeTimeout: 30s
  gracefulTimeout: 15s
  maxBodySize: 10M

logging:
  level: ${LOG_LEVEL:-info}
  json: true

monitoring:
  enabled: true
  path: /metrics

# The admin interface is off unless you turn it on. When ODIN_ADMIN_ENABLED=true and no password
# is set (ODIN_ADMIN_PASSWORD, or admin.passwordHash), a random one is printed in the log.
admin:
  enabled: ${ODIN_ADMIN_ENABLED:-false}
  username: ${ODIN_ADMIN_USERNAME:-admin}

# Services with authentication: true need a signing secret: set ODIN_JWT_SECRET.
auth:
  ignorePathRegexes:
    - ^/health$
    - ^/ready$
    - ^/live$
    - ^/metrics$

services: []
