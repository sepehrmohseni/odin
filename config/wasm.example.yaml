# WebAssembly plugins (docs/plugins.md#webassembly-plugins).
#
# Build the example plugin first:
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared \
#     -o /etc/odin/plugins/api-key.wasm ./examples/wasm-plugins/api-key

wasm:
  enabled: true
  pluginDir: /etc/odin/plugins
  maxMemoryPages: 512     # per instance, 64 KiB pages (32 MiB)
  maxInstances: 4         # requests one plugin handles at a time

  plugins:
    # API keys checked before the JWT check; the upstream gets the key's owner instead.
    - name: api-key
      path: api-key.wasm
      enabled: true
      phase: pre-auth      # pre-auth, post-auth (default) or pre-proxy
      priority: 10
      routes: ["/api/*"]
      timeout: 100ms
      failOpen: false      # a failing plugin answers 500 instead of letting requests through
      config:
        header: X-API-Key
        keys:
          k-123: mobile-app
          k-456: partner-acme

services:
  - name: orders
    basePath: /api/orders
    targets: [http://orders:8080]
