# Odin configuration for the local development stack in docker-compose.yml. Secrets come from
# the environment (.env, see .env.example); ${NAME} is required, ${NAME:-x} has a default.

server:
  port: 8080
  readTimeout: 30s
  writeTimeout: 60s
  gracefulTimeout: 15s
  maxBodySize: 10M

logging:
  level: ${LOG_LEVEL:-info}
  json: false

monitoring:
  enabled: true
  path: /metrics

admin:
  enabled: true
  username: ${ODIN_ADMIN_USERNAME:-admin}
  # password: from ODIN_ADMIN_PASSWORD

# Learn each service's normal traffic and report anomalies (admin: Anomalies). The demo's
# unreliable inventory service gives it something to find within a few minutes.
ai:
  enabled: true
  analysisInterval: 1m
  baselineWindow: 15m
  minSamplesForBaseline: 5

# An OpenAPI document of the routes below at /openapi.json, browsable at /openapi.
openapi:
  enabled: true
  title: Odin quickstart
  description: The demo services of the Odin quickstart stack (docker-compose.yml).
  uiEnabled: true

auth:
  # jwtSecret: from ODIN_JWT_SECRET
  ignorePathRegexes:
    - ^/health$
    - ^/metrics$

# Shared Redis for rate limits and the response cache, so every gateway replica agrees.
rateLimit:
  enabled: true
  limit: 600
  duration: 1m
  strategy: redis
  redisUrl: redis://redis:6379/0

cache:
  enabled: true
  ttl: 30s
  strategy: redis
  redisUrl: redis://redis:6379/1

# MongoDB stores uploaded plugins and integration settings.
mongodb:
  enabled: true
  uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
  database: odin
  connectTimeout: 10s

services:
  - name: users
    basePath: /api/users
    targets: [http://users-service:8081]
    healthCheck:
      enabled: true
      path: /api/users
      interval: 10s

  - name: products
    basePath: /api/products
    targets: [http://products-service:8083]
    circuitBreaker:
      enabled: true
    healthCheck:
      enabled: true
      path: /api/products
      interval: 10s

  - name: orders
    basePath: /api/orders
    targets: [http://orders-service:8084]
    authentication: true
    cache:
      enabled: false
    healthCheck:
      enabled: true
      path: /health
      interval: 10s

  - name: categories
    basePath: /api/categories
    targets: [http://categories-service:8085]
    rateLimit:
      limit: 120
      window: 1m
    healthCheck:
      enabled: true
      path: /health
      interval: 10s

  # A deliberately unreliable backend that only runs in demo mode (scripts/quickstart.sh
  # --demo): it sometimes fails or is slow, and is down for maintenance 30 s in every 3 min,
  # to show timeouts, retries, health checks and the circuit breaker. Without --demo its
  # backend is not running and this route answers 502.
  - name: inventory
    basePath: /api/inventory
    targets: [http://inventory-service:8086]
    timeout: 1s
    retryCount: 1
    cache:
      enabled: false
    healthCheck:
      enabled: true
      path: /health
      interval: 5s
      unhealthyThreshold: 2
    circuitBreaker:
      enabled: true
      failureRatio: 0.5
      minRequests: 10
      timeout: 15s
