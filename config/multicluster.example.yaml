# Multi-cluster failover (docs/traffic.md#multi-cluster-failover).
#
# Two gateways serve the same routes in two regions. This one (eu-central) sends a service's
# requests to us-east only when none of its own targets is available, and us-east can be
# configured the same way in reverse: the X-Odin-Cluster-Hop header stops a request from being
# passed back.

multiCluster:
  enabled: true
  localCluster: eu-central
  failoverStrategy: failover   # or active: clusters share the traffic with the service's targets
  clusters:
    - name: us-east
      endpoint: https://us-east.gateway.example.com
      region: us-east-1
      priority: 10              # higher is tried first
      enabled: true
      healthCheck:
        enabled: true
        path: /health
        interval: 10s
        timeout: 3s
        unhealthyThreshold: 2
        healthyThreshold: 1
      auth:                     # sent with the health check only
        type: token
        token: ${CLUSTER_AUTH_TOKEN}
      tls:                      # for the health check and for forwarded requests
        enabled: true
        caFile: /etc/odin/tls/clusters-ca.pem

    - name: ap-south
      endpoint: https://ap-south.gateway.example.com
      region: ap-south-1
      priority: 5
      enabled: true
      healthCheck:
        enabled: true

services:
  - name: orders
    basePath: /api/orders
    targets: [http://orders:8080]
    healthCheck:                # needed to notice that the local targets are down
      enabled: true
      path: /health
      interval: 5s
    clusters: [us-east, ap-south]

  - name: catalog
    basePath: /api/catalog
    targets: [http://catalog:8080]
    clusters: ["*"]             # every enabled cluster
