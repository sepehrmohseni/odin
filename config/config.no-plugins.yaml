server:
  port: 8080

services:
  # HTTP service
  - name: users
    basePath: /api/users
    protocol: http
    targets:
      - http://localhost:8081
    authentication: true

  # GraphQL service
  - name: graphql-api
    basePath: /graphql
    protocol: graphql
    targets:
      - http://localhost:4000/graphql
    authentication: false
    graphql:
      maxQueryDepth: 10
      maxQueryComplexity: 1000
      enableIntrospection: true
      enableQueryCaching: true
      cacheTTL: 5m0s

  # gRPC service
  - name: user-grpc
    basePath: /grpc/users
    protocol: grpc
    targets:
      - localhost:50051
    authentication: true
    timeout: 30s
    grpc:
      maxMessageSize: 4194304

auth:
  jwtSecret: ${ODIN_JWT_SECRET}

cache:
  enabled: true
  strategy: local
  ttl: 10m

rateLimit:
  enabled: true
  limit: 100
  duration: 1m
  strategy: local
  algorithm: sliding_window

monitoring:
  enabled: true
  path: /metrics
