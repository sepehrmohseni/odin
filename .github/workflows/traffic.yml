# Daily totals for the README badges: clones and views (GitHub's traffic API, which keeps only
# 14 days and needs the TRAFFIC_TOKEN secret, a fine-grained token with read access to this
# repository's Administration permission) and container image downloads. The running totals
# and the badge files live on the traffic-data branch; see scripts/traffic-badges.py.
name: Traffic badges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - name: Check out traffic-data
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" traffic-data >/dev/null; then
            git clone -q --depth 1 --branch traffic-data "$REMOTE" data
          else
            git init -q -b traffic-data data
            git -C data remote add origin "$REMOTE"
          fi

      - name: Update the totals
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 -I main/scripts/traffic-badges.py data

      - name: Publish
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "traffic: $(date -u +%F)"
          git push -q origin traffic-data
