name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The same checks as `scripts/docker-check.sh all` on a developer machine: go mod verify, gofmt,
  # go vet, build, race tests, golangci-lint and govulncheck, in the pinned image from docker/ci.
  checks:
    name: Checks (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/docker-check.sh all
        run: scripts/docker-check.sh all

  # The development stack from docker-compose.yml, started the way a new user would.
  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (scripts/quickstart.sh)
        run: scripts/quickstart.sh
      - name: Probe the gateway
        run: |
          set -eux
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/products
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/orders)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/api/settings)" = 401
          test "$(docker compose exec -T odin id -u)" = 65532
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with coverage of ./pkg/...
        run: go test -count=1 -covermode=atomic -coverpkg=./pkg/... -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          go build -o bin/odin ./cmd/odin
          go build -o bin/odin-migrate ./cmd/migrate
      - uses: actions/upload-artifact@v4
        with:
          name: odin-binaries
          path: bin/
