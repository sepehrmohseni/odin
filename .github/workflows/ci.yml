name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The same checks as `scripts/docker-check.sh all` on a developer machine: go mod verify, gofmt,
  # go vet, build, race tests, golangci-lint and govulncheck, in the pinned image from docker/ci.
  checks:
    name: Checks (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/docker-check.sh all
        run: scripts/docker-check.sh all

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with coverage of ./pkg/...
        run: go test -count=1 -covermode=atomic -coverpkg=./pkg/... -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          go build -o bin/odin ./cmd/odin
          go build -o bin/odin-migrate ./cmd/migrate
      - uses: actions/upload-artifact@v4
        with:
          name: odin-binaries
          path: bin/
