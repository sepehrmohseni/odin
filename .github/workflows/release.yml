name: Release

# Runs when a version tag (vX.Y.Z) is pushed: binaries, archives, checksums and SBOMs on the
# GitHub release (GoReleaser), and a multi-arch image on GHCR with SBOM and provenance
# attestations, signed with keyless cosign.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io
  id-token: write # keyless cosign signing

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.57.2
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/odin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.6
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/odin@${{ steps.build.outputs.digest }}"
