version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  # errcheck, govet, ineffassign, staticcheck (which now includes gosimple) and unused.
  default: standard
  enable:
    - gocritic
    - gosec
    - misspell
    - prealloc
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G204 # Subprocess launched with variable
        - G304 # File path provided as taint input
        - G704 # SSRF via taint analysis: forwarding requests to configured URLs is the gateway's job
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - hugeParam
        - rangeValCopy
        - httpNoBody
        - importShadow
        - octalLiteral
        - paramTypeCombine
        - ifElseChain
        - appendCombine
        - nestingReduce
        - emptyStringTest
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: ^test/
        linters:
          - gosec
          - errcheck
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
